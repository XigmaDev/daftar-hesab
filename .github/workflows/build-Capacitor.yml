name: Build Android APK

# اجرا با پوش کردن یک تگ (مثلاً v1.0.0) یا به‌صورت دستی از تب Actions
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # لازم برای ساخت Release و آپلود فایل

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 'secrets' context is not allowed directly inside step-level `if:` conditions,
      # so we pass it through job-level env vars and check those instead.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install project dependencies
        run: npm install

      - name: 'Fix invalid Capacitor webDir (Capacitor rejects webDir: ".")'
        # capacitor.config.json در این پروژه webDir را روی "." (ریشه‌ی پروژه)
        # تنظیم کرده که مقدار نامعتبری است — Capacitor اجازه نمی‌دهد کل ریشه‌ی
        # پروژه (شامل node_modules, .git و ...) به‌عنوان وب‌روت کپی شود. این
        # استپ یک پوشه‌ی www می‌سازد، فایل‌های وب را داخلش کپی می‌کند و
        # capacitor.config.json را طوری پچ می‌کند که webDir به www اشاره کند.
        # توصیه می‌شود این مشکل به‌صورت دائمی هم در خود ریپو اصلاح شود تا
        # `npx cap sync` روی سیستم توسعه‌دهنده هم بدون این استپ کار کند.
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import re
          import shutil

          config_path = None
          for candidate in ("capacitor.config.json", "capacitor.config.ts"):
              if os.path.exists(candidate):
                  config_path = candidate
                  break

          if config_path is None:
              raise SystemExit("capacitor.config.json/.ts پیدا نشد.")

          if config_path.endswith(".json"):
              with open(config_path, "r", encoding="utf-8") as f:
                  config = json.load(f)
              web_dir = str(config.get("webDir", "."))
          else:
              with open(config_path, "r", encoding="utf-8") as f:
                  raw = f.read()
              m = re.search(r'webDir\s*:\s*[\'"]([^\'"]+)[\'"]', raw)
              web_dir = m.group(1) if m else "."

          print(f"webDir فعلی: '{web_dir}'")

          if web_dir.strip() in (".", "", "./"):
              target = "www"
              os.makedirs(target, exist_ok=True)
              exclude = {
                  "node_modules", ".git", ".github", "android", "ios",
                  target, "android-native-sample", ".gradle", "build",
              }
              for item in os.listdir("."):
                  if item in exclude:
                      continue
                  src = os.path.join(".", item)
                  dst = os.path.join(target, item)
                  if os.path.isdir(src):
                      shutil.copytree(src, dst, dirs_exist_ok=True)
                  else:
                      shutil.copy2(src, dst)

              if config_path.endswith(".json"):
                  config["webDir"] = target
                  with open(config_path, "w", encoding="utf-8") as f:
                      json.dump(config, f, indent=2, ensure_ascii=False)
              else:
                  raw = re.sub(
                      r'(webDir\s*:\s*[\'"])([^\'"]+)([\'"])',
                      rf'\g<1>{target}\g<3>',
                      raw,
                  )
                  with open(config_path, "w", encoding="utf-8") as f:
                      f.write(raw)

              print(f"{config_path} پچ شد: webDir -> '{target}'")
          else:
              print("webDir معتبر است، تغییری اعمال نشد.")
          PYEOF

      - name: Add Android platform (if not already present)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "پوشه android از قبل وجود دارد، از cap add صرف‌نظر شد."
          fi

      - name: Copy native SMS plugin + background receiver into the Android project
        run: |
          set -e
          PKG_DIR="android/app/src/main/java/ir/local/daftartarakonesh"
          mkdir -p "$PKG_DIR"
          cp android-native-sample/SmsReceiverPlugin.kt "$PKG_DIR/SmsReceiverPlugin.kt"
          cp android-native-sample/SmsBroadcastReceiver.kt "$PKG_DIR/SmsBroadcastReceiver.kt"

      - name: Enable Kotlin support in the Android project
        # پروژه‌ی اندروید تولیدشده توسط `cap add android` به‌صورت پیش‌فرض فقط Java
        # است و پلاگین Kotlin روش فعال نیست؛ به همین دلیل فایل‌های .kt (از جمله
        # SmsReceiverPlugin.kt) اصلاً کامپایل نمی‌شدند و import آن‌ها در
        # MainActivity.java با خطای "cannot find symbol" مواجه می‌شد. این استپ
        # پلاگین Kotlin را به build.gradle های پروژه اضافه می‌کند.
        run: |
          python3 - <<'PYEOF'
          import re

          KOTLIN_VERSION = "1.9.24"

          # ۱) android/build.gradle (سطح پروژه): افزودن classpath پلاگین کاتلین
          project_gradle = "android/build.gradle"
          with open(project_gradle, "r", encoding="utf-8") as f:
              content = f.read()

          if "kotlin-gradle-plugin" not in content:
              content = re.sub(
                  r"(dependencies\s*\{)",
                  r"\1\n        classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:"
                  + KOTLIN_VERSION + "\"",
                  content,
                  count=1,
              )
              with open(project_gradle, "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"{project_gradle} patched with kotlin-gradle-plugin classpath.")
          else:
              print(f"{project_gradle} already has kotlin-gradle-plugin, skipping.")

          # ۲) android/app/build.gradle (ماژول app): اعمال پلاگین kotlin-android + وابستگی stdlib
          app_gradle = "android/app/build.gradle"
          with open(app_gradle, "r", encoding="utf-8") as f:
              content = f.read()

          if "kotlin-android" not in content:
              content = re.sub(
                  r"(apply plugin:\s*['\"]com\.android\.application['\"]\s*\n)",
                  r"\1apply plugin: 'kotlin-android'\n",
                  content,
                  count=1,
              )
              content = re.sub(
                  r"(dependencies\s*\{)",
                  r"\1\n    implementation \"org.jetbrains.kotlin:kotlin-stdlib:"
                  + KOTLIN_VERSION + "\"",
                  content,
                  count=1,
              )
              with open(app_gradle, "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"{app_gradle} patched with kotlin-android plugin + stdlib dependency.")
          else:
              print(f"{app_gradle} already has kotlin-android, skipping.")
          PYEOF

      - name: Apply AndroidManifest additions (permissions + receiver)
        run: |
          python3 - <<'PYEOF'
          import re

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          permissions = (
              '    <uses-permission android:name="android.permission.RECEIVE_SMS" />\n'
              '    <uses-permission android:name="android.permission.READ_SMS" />\n'
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
          )

          receiver = (
              '        <receiver\n'
              '            android:name="ir.local.daftartarakonesh.SmsBroadcastReceiver"\n'
              '            android:exported="true"\n'
              '            android:permission="android.permission.BROADCAST_SMS">\n'
              '            <intent-filter android:priority="999">\n'
              '                <action android:name="android.provider.Telephony.SMS_RECEIVED" />\n'
              '            </intent-filter>\n'
              '        </receiver>\n'
          )

          # افزودن مجوزها درست قبل از تگ <application ...> (فقط اگر قبلا اضافه نشده باشد)
          if "android.permission.RECEIVE_SMS" not in content:
              content = re.sub(r"(\s*<application)", "\n" + permissions + r"\1", content, count=1)

          # افزودن Receiver درست قبل از </application> (فقط اگر قبلا اضافه نشده باشد)
          if "SmsBroadcastReceiver" not in content:
              content = content.replace("</application>", receiver + "    </application>")

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)

          print("AndroidManifest.xml patched successfully.")
          PYEOF

      - name: Register plugin in MainActivity
        run: |
          python3 - <<'PYEOF'
          import glob
          import re

          candidates = glob.glob("android/app/src/main/java/**/MainActivity.*", recursive=True)
          if not candidates:
              raise SystemExit("MainActivity file not found — please check the Capacitor project structure.")

          main_activity_path = candidates[0]
          with open(main_activity_path, "r", encoding="utf-8") as f:
              content = f.read()

          if "SmsReceiverPlugin" in content:
              print("Plugin already registered, skipping.")
          else:
              is_kotlin = main_activity_path.endswith(".kt")
              import_line = (
                  "import ir.local.daftartarakonesh.SmsReceiverPlugin"
                  if is_kotlin
                  else "import ir.local.daftartarakonesh.SmsReceiverPlugin;"
              )
              register_line = (
                  "        registerPlugin(SmsReceiverPlugin::class.java)\n"
                  if is_kotlin
                  else "        registerPlugin(SmsReceiverPlugin.class);\n"
              )

              # افزودن import
              if import_line not in content:
                  content = re.sub(
                      r"(package [^\n]+\n)",
                      r"\1\n" + import_line + "\n",
                      content,
                      count=1,
                  )

              # افزودن ثبت پلاگین داخل onCreate (بعد از super.onCreate)
              content = re.sub(
                  r"(super\.onCreate\([^)]*\)\s*\n)",
                  r"\1" + register_line,
                  content,
                  count=1,
              )

              with open(main_activity_path, "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"Plugin registered in {main_activity_path}")
          PYEOF

      - name: Build web assets (if a build script exists)
        run: |
          if node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.build ? 0 : 1)"; then
            npm run build
          else
            echo "هیچ اسکریپت build ای در package.json پیدا نشد — از این مرحله صرف‌نظر شد (فرض بر PWA ساده‌ی بدون باندلر است)."
          fi

      - name: Ensure Android assets directory exists
        # پوشه‌ی android/app/src/main/assets معمولاً در .gitignore قرار دارد چون
        # به‌صورت خودکار توسط cap add/cap copy ساخته می‌شود. وقتی android/ از قبل
        # داخل ریپو کامیت شده (و در نتیجه مرحله‌ی cap add صرف‌نظر می‌شود)، این پوشه
        # در چک‌اوت تازه‌ی CI اصلاً وجود ندارد و cap sync هنگام نوشتن
        # capacitor.plugins.json با خطای ENOENT مواجه می‌شود.
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor (copy web assets + native deps)
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode signing keystore (optional)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build release APK (signed if keystore secrets provided, otherwise debug)
        working-directory: android
        run: |
          if [ -f app/release.keystore ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=release.keystore \
              -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
          else
            echo "کلید امضا تنظیم نشده — یک نسخه‌ی Debug ساخته می‌شود."
            ./gradlew assembleDebug
          fi

      - name: Locate built APK
        id: apk
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "path=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "path=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi
        working-directory: android

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
